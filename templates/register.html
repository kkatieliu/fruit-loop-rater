{% extends "base.html" %}

{% block title %}Register: Fruit Loops{% endblock %}

{% block content %}
    <div class="auth-page">
        <h1>Create an account 🍓</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/register" class="form-card">
            <div class="field">
                <label>Username:
                    <input type="text" name="username" required>
                </label>
            </div>
            <div class="field">
                <label>Password:
                    <input type="password" name="password" required>
                </label>
            </div>
            <div class="field">
                <label>Email:
                    <input type="email" name="email" required>
                </label>
            </div>
            <button type="submit" class="btn-primary">Register</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="/login">Log in</a></p>
        <p class="auth-footer"><a href="/">← Back to fruits</a></p>
    </div>
{% endblock %}
